<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Izračun sorazmernega dela regresa za letni dopust." />
    <title>Izračun regresa</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the
      // wrong colors. Keep the key in sync with src/lib/useTheme.ts.
      try {
        var theme = localStorage.getItem('regres-theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
